name: Build Mac installers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies and Electron
        run: |
          npm ci --ignore-scripts
          node node_modules/electron/install.js
      - name: Run business tests
        run: npm test
      - name: Build unsigned Apple Silicon and Intel applications
        run: npm run dist:mac
      - name: Generate checksums
        run: |
          cd dist
          shasum -a 256 *.zip > SHA256SUMS.txt
      - name: Attach installers to this workflow run
        uses: actions/upload-artifact@v4
        with:
          name: luvtora-mac-installers
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error
      - name: Create a draft GitHub release for review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release create "v${version}" dist/*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --draft \
            --title "Luvtora Operations ${version}" \
            --notes-file docs/RELEASE-NOTES.md
